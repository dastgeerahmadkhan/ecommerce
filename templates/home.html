{% extends "base.html" %}

{% block content %}

<h1 class="text-3xl mb-6">Products</h1>

<div class="grid grid-cols-4 gap-6">

{% for product in products %}

<div class="bg-white shadow rounded p-4">

<img src="{{product.image.url}}" class="h-48 w-full object-cover">

<h2 class="text-xl mt-2">{{product.name}}</h2>

<p class="text-gray-600">${{product.price}}</p>

<a href="/product/{{product.id}}/" class="text-blue-500">
View
</a>

<a href="/cart/add/{{product.id}}/" class="block bg-black text-white text-center mt-2 p-2">
Add to Cart your order
</a>

</div>

{% endfor %}

</div>

{% endblock %}
